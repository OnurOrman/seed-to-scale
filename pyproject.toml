[project]
name = "seed-to-scale"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Onur Orman", email = "onur142ormn@gmail.com" }
]
requires-python = ">=3.14.5"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "jupyter>=1.1.1",
    "matplotlib>=3.10.9",
    "networkx>=3.6.1",
    "pandas>=3.0.3",
    "playwright>=1.59.0",
    "python-dotenv>=1.2.2",
    "scrapy>=2.15.2",
    "seaborn>=0.13.2",
]

classifiers = ["Private :: Do Not Upload"]

[tool.uv]
package = false

[dependency-groups]
dev = []

[build-system]
requires = ["uv_build>=0.10.9,<1"]
build-backend = "uv_build"

